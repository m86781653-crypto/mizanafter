name: database-contract

# Full migration-chain contract gate: local Supabase must boot before SQL authorization contracts run.
# The gate intentionally executes against a clean local database.
# Migration-chain repair is verified on every push.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - integration/reference-mirror-sync-complete-v2

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate migration ordering
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No SQL migrations found" >&2
            exit 1
          fi
          declare -A seen=()
          previous=""
          for file in "${migrations[@]}"; do
            stamp="${file:0:14}"
            if [[ ! "$stamp" =~ ^[0-9]{14}$ ]]; then
              echo "Invalid migration timestamp prefix: $file" >&2
              exit 1
            fi
            if [[ -n "${seen[$stamp]:-}" ]]; then
              echo "Duplicate migration timestamp: $stamp ($file and ${seen[$stamp]})" >&2
              exit 1
            fi
            seen[$stamp]="$file"
            if [[ -n "$previous" && "$file" < "$previous" ]]; then
              echo "Migration filenames are not lexicographically ordered: $previous -> $file" >&2
              exit 1
            fi
            previous="$file"
          done

      - name: Start local Supabase
        run: supabase db start

      - name: Run authorization security contract
        run: supabase test db supabase/tests/013_authorization_surface_contract.test.sql

      - name: Run update write-boundary contract
        run: supabase test db supabase/tests/014_update_write_boundary_contract.test.sql

      - name: Run privilege minimization contract
        run: supabase test db supabase/tests/015_privilege_minimization_contract.test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
