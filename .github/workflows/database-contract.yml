name: database-contract

on:
  pull_request:
    branches:
      - main
      - production/unified-integration
  push:
    branches:
      - production/unified-integration

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Validate migration ordering
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No SQL migrations found" >&2
            exit 1
          fi
          declare -A seen=()
          previous=""
          for file in "${migrations[@]}"; do
            stamp="${file:0:14}"
            if [[ ! "$stamp" =~ ^[0-9]{14}$ ]]; then
              echo "Invalid migration timestamp prefix: $file" >&2
              exit 1
            fi
            if [[ -n "${seen[$stamp]:-}" ]]; then
              echo "Duplicate migration timestamp: $stamp ($file and ${seen[$stamp]})" >&2
              exit 1
            fi
            seen[$stamp]="$file"
            if [[ -n "$previous" && "$file" < "$previous" ]]; then
              echo "Migration filenames are not lexicographically ordered: $previous -> $file" >&2
              exit 1
            fi
            previous="$file"
          done
      - name: Start local Supabase
        run: supabase db start
      - name: Run MRX contract tests
        run: supabase test db supabase/tests/010_mrx_idempotency_contract.test.sql
      - name: Run billing reconciliation contract tests
        run: supabase test db supabase/tests/011_billing_reconciliation_contract.test.sql
      - name: Run security surface contract tests
        run: supabase test db supabase/tests/012_security_surface_contract.test.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
