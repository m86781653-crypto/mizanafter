name: database-contract

# Full migration-chain contract gate: local Supabase must boot before SQL authorization contracts run.
# The gate intentionally executes against a clean local database.
# Migration-chain repair is verified on every push.
# Governance lifecycle contract is kept aligned with retired legacy RPC paths.
# Governed object reconstruction is part of the clean-room gate.
# Tenant prerequisites are validated before role enforcement.
# Authorization policies are applied only after the private kernel exists.
# Permission catalog is bootstrapped before the kernel.
# RPC ACL hardening runs only after governed function definitions.
# Policy contracts normalize PostgreSQL's expression serialization.
# SQL assertions use dollar-quoted patterns to avoid parser ambiguity.
# Final policy convergence is checked after the complete migration chain.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - integration/reference-mirror-sync-complete-v2

concurrency:
  group: database-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.54.1

      - name: Validate migration ordering
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No SQL migrations found" >&2
            exit 1
          fi
          declare -A seen=()
          previous=""
          for file in "${migrations[@]}"; do
            stamp="${file:0:14}"
            if [[ ! "$stamp" =~ ^[0-9]{14}$ ]]; then
              echo "Invalid migration timestamp prefix: $file" >&2
              exit 1
            fi
            if [[ -n "${seen[$stamp]:-}" ]]; then
              echo "Duplicate migration timestamp: $stamp ($file and ${seen[$stamp]})" >&2
              exit 1
            fi
            seen[$stamp]="$file"
            if [[ -n "$previous" && "$file" < "$previous" ]]; then
              echo "Migration filenames are not lexicographically ordered: $previous -> $file" >&2
              exit 1
            fi
            previous="$file"
          done

      - name: Start local Supabase
        run: supabase db start

      - name: Run authorization security contract
        run: supabase test db supabase/tests/013_authorization_surface_contract.test.sql

      - name: Run update write-boundary contract
        run: supabase test db supabase/tests/014_update_write_boundary_contract.test.sql

      - name: Run privilege minimization contract
        run: supabase test db supabase/tests/015_privilege_minimization_contract.test.sql

      - name: Run billing and tariff contract
        run: supabase test db supabase/tests/016_billing_tariff_contract.test.sql

      - name: Run tariff engine contract
        run: supabase test db supabase/tests/017_tariff_engine_contract.test.sql

      - name: Run payment approval contract
        run: supabase test db supabase/tests/018_payment_approval_contract.test.sql

      - name: Run central governance contract
        run: supabase test db supabase/tests/019_central_governance_user_administration_contract.test.sql

      - name: Run subtenant role invariant contract
        run: supabase test db supabase/tests/020_subtenant_production_role_invariant.test.sql

      - name: Run fair variable-period billing contract
        run: supabase test db supabase/tests/021_fair_variable_period_billing.test.sql

      - name: Run field collection billing integrity contract
        run: supabase test db supabase/tests/021_field_collection_billing_integrity.test.sql

      - name: Run subtenant production contract
        run: supabase test db supabase/tests/021_subtenant_production_contract.test.sql

      - name: Run authenticated helper privilege contract
        run: supabase test db supabase/tests/022_authenticated_rls_helper_privilege_contract.test.sql

      - name: Run root security write-boundary contract
        run: supabase test db supabase/tests/023_root_security_write_boundaries.test.sql

      - name: Run production integrity contract
        run: supabase test db supabase/tests/024_production_integrity_contract.test.sql

      - name: Run automatic customer meter link date contract
        run: supabase test db supabase/tests/025_customer_meter_link_date_contract.test.sql

      - name: Run meter identity contract
        run: supabase test db supabase/tests/026_meter_identity_contract.test.sql

      - name: Run meter reading quality engine contract
        run: supabase test db supabase/tests/027_meter_reading_quality_engine_contract.test.sql

      - name: Run meter reading quality review contract
        run: supabase test db supabase/tests/028_meter_reading_quality_review_contract.test.sql

      - name: Run water production measurement contract
        run: supabase test db supabase/tests/029_water_production_measurement_contract.test.sql

      - name: Run no service-role application contract
        run: supabase test db supabase/tests/030_no_service_role_application_contract.test.sql

      - name: Run maintenance workflow contract
        run: supabase test db supabase/tests/031_maintenance_workflow_contract.test.sql

      - name: Run final maintenance lifecycle contract
        run: supabase test db supabase/tests/032_maintenance_lifecycle_final_contract.test.sql

      - name: Run extension schema security contract
        run: supabase test db supabase/tests/033_extension_schema_security_contract.test.sql

      - name: Run governed operational reporting contract
        run: supabase test db supabase/tests/034_governed_operational_reporting_contract.test.sql

      - name: Run MIZAN security definer contract
        run: supabase test db supabase/tests/035_mizan_security_definer_contract.test.sql

      - name: Run production operational governance contract
        run: supabase test db supabase/tests/036_production_operational_governance_contract.test.sql

      - name: Run AI audit write path contract
        run: supabase test db supabase/tests/037_ai_audit_write_path_contract.test.sql

      - name: Run project-scoped relationship contract
        run: supabase test db supabase/tests/038_project_scoped_relationship_contract.test.sql
      - name: Run password state authority contract
        run: supabase test db supabase/tests/039_password_state_authority_contract.test.sql
      - name: Run governed existing-customer meter contract
        run: supabase test db supabase/tests/040_existing_customer_meter_contract.test.sql
      - name: Run invoker report schema usage contract
        run: supabase test db supabase/tests/041_invoker_report_schema_usage_contract.test.sql
      - name: Run permission resolution contract
        run: supabase test db supabase/tests/042_permission_resolution_contract.test.sql
      - name: Run governed payment recording lock contract
        run: supabase test db supabase/tests/044_payment_recording_lock_contract.test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
