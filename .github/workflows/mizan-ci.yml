name: MIZAN CI

on:
  push:
    branches: ["main", "integrate/**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify Copilot single authority contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const page = fs.readFileSync('src/pages/CopilotPage.tsx', 'utf8');
          const edge = fs.readFileSync('supabase/functions/mizan-copilot/index.ts', 'utf8');
          if (page.includes("daily_output_m3") || page.includes("from('payments').select('amount')")) {
            throw new Error('CopilotPage contains a legacy local KPI source');
          }
          if (page.includes('const nrw = production > 0') || page.includes('const production = (wells || []).reduce')) {
            throw new Error('CopilotPage contains a legacy local KPI calculation fallback');
          }
          if (edge.includes('daily_output_m3')) {
            throw new Error('mizan-copilot must not expose wells.daily_output_m3 to the model context');
          }
          if (!edge.includes("mizan_operational_report")) {
            throw new Error('mizan-copilot must use the governed operational report');
          }
          if (!edge.includes("mizan_log_ai_interaction")) {
            throw new Error('mizan-copilot must use the governed AI audit path');
          }
          console.log('Copilot single-authority contract: PASS');
          NODE
      - name: Verify UI source-of-truth contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reports = fs.readFileSync('src/pages/ReportsPage.tsx', 'utf8');
          const settings = fs.readFileSync('src/pages/SettingsPage.tsx', 'utf8');
          if (!reports.includes("timeZone: 'Asia/Aden'")) throw new Error('ReportsPage must derive business dates in Asia/Aden');
          if (reports.includes("useState(() => new Date().toISOString().slice(0,10))")) throw new Error('ReportsPage uses unsafe UTC default date');
          if (reports.includes("new Date(new Date().getFullYear(), 0, 1).toISOString()")) throw new Error('ReportsPage uses unsafe local-date-to-UTC conversion');
          if (!reports.includes("periodEndExclusive")) throw new Error('ReportsPage must use exclusive end boundary');
          if (!settings.includes("mizan_complete_password_change")) throw new Error('SettingsPage must use the governed password completion RPC');
          if (settings.includes("profiles').update({ must_change_password: false")) throw new Error('SettingsPage must not update password state directly');
          console.log('UI source-of-truth contracts: PASS');
          NODE
      - name: Verify PostgREST relationship hints
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expectations = [
            ['src/pages/MaintenancePage.tsx', 'faults!fk_work_orders_project_fault('],
            ['src/pages/BillingPage.tsx', 'customers!fk_invoices_project_customer('],
            ['src/pages/BillingPage.tsx', 'customers!fk_payments_project_customer(',],
            ['src/pages/BillingPage.tsx', 'invoices!fk_payments_project_invoice('],
            ['src/pages/CustomersPage.tsx', 'customers!fk_meters_project_customer('],
            ['src/pages/ReadingsPage.tsx', 'customers!fk_meters_project_customer!inner('],
          ];
          for (const [file, marker] of expectations) {
            const content = fs.readFileSync(file, 'utf8');
            if (!content.includes(marker)) throw new Error(`Missing explicit relationship hint: ${file} -> ${marker}`);
          }
          for (const file of ['src/pages/MaintenancePage.tsx','src/pages/BillingPage.tsx','src/pages/CustomersPage.tsx','src/pages/ReadingsPage.tsx']) {
            const content = fs.readFileSync(file, 'utf8');
            if (/\.select\(['"][^'"]+\b(customers|faults|invoices)\([^)]/.test(content) &&
                !content.includes('!fk_')) {
              throw new Error(`Potential unqualified embedded relationship remains in ${file}`);
            }
          }
          console.log('PostgREST relationship hints: PASS');
          NODE

