name: production-checks

on:
  pull_request:
    branches:
      - main
      - production/unified-integration
  push:
    branches:
      - production/unified-integration

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate offline OCR runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f public/mizan-offline.js
          test -f index.html
          grep -Fq '/mizan-ocr/tesseract.min.js' index.html
          grep -Fq "'/mizan-ocr/tesseract.min.js'" public/mizan-offline.js
          if grep -Fq 'cdn.jsdelivr.net/npm/tesseract.js@' index.html; then
            echo 'index.html must not load Tesseract directly from CDN; use the local offline runtime path.' >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
